name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: |
          pip install pandas tqdm openpyxl pytest snakemake
          # Python 3.10 resolves to Snakemake 7, which needs the pre-2.8 pulp API.
          if [ "${{ matrix.python-version }}" = "3.10" ]; then pip install "pulp<2.8"; fi
      - name: Run tests (includes a Snakefile dry run)
        run: pytest -q
