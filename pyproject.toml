[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pegas"
version = "1.3.0"
description = "PeGAS: a Snakemake pipeline for bacterial genome analysis"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-2.0-or-later" }
authors = [
    { name = "Liviu-Iulian Rotaru" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v2 or later (GPLv2+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

[project.scripts]
pegas = "pegas.main:main"
pegas-lite = "pegas.main_lite:main"

[project.urls]
Homepage = "https://github.com/liviurotiul/PeGAS"
Issues = "https://github.com/liviurotiul/PeGAS/issues"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pegas = [
    "Snakefile",
    "layout.html",
    "report_template.Rmd",
    "render_report.R",
    "report_static.css",
    "gc_content.json",
    "envs/*.yml",
    "envs/*.pin.txt",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
